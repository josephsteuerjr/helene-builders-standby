name: Mixed local and remote profiles
on:
  push:
    branches: ['codex/mixed-profiles-300-2411']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scenario: [roundtrip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare published fixtures on loopback
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/serverqa/ssh"
          cp -R qa_server.py qa_prepare.py qa_mixed.py candidate "$RUNNER_TEMP/serverqa/"
          cd "$RUNNER_TEMP/serverqa"
          curl -fsSL --retry 4 "https://github.com/josephsteuerjr/praxis/releases/download/v2.9.2/Helene-2.9.2-linux-x86_64.zip" -o linux.zip
          echo 'aee3ff053dc1424b6fee243b2f6d6716a4be889871c082d3a5436457f30c57e7  linux.zip' | sha256sum -c
          python qa_prepare.py
          ssh-keygen -q -t ed25519 -N '' -f ssh/client
          ssh-keygen -q -t ed25519 -N '' -f ssh/host
          sudo mkdir -p /run/sshd /run/helene-ci
          sudo install -o root -m 600 ssh/client.pub /run/helene-ci/authorized_keys
          sudo /usr/sbin/sshd -f /dev/null -p 29690 -h "$PWD/ssh/host" -o ListenAddress=127.0.0.1 -o AuthorizedKeysFile=/run/helene-ci/authorized_keys -o UsePAM=yes -o PermitRootLogin=prohibit-password -o PasswordAuthentication=no -o "PidFile=$PWD/ssh/probe.pid" -o 'Subsystem=sftp internal-sftp'
      - name: Deploy, update and return
        if: matrix.scenario == 'roundtrip'
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP/serverqa"
          export PYTHONPATH="$PWD/desktop/app:$PWD/desktop/app/localharness"
          timeout 17m desktop/runtime/bin/python3 -Bu qa_mixed.py
      - name: Retain results and build error on failure
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          for file in mixed transfer markers; do
            p="$RUNNER_TEMP/serverqa/$file.json"
            if test -f "$p"; then cp "$p" evidence/; fi
          done
          for dir in /opt/helene-qa-300-2411-a9db /opt/helene-qa-300-2411-a9db-fresh; do
            if sudo test -f "$dir/.install-last.log"; then sudo tail -40 "$dir/.install-last.log"; fi
          done
          if sudo test -f /opt/helene-qa-300-2411-a9db/data/memory/.control/update-receipt.json; then
            sudo python -c "import json; r=json.load(open('/opt/helene-qa-300-2411-a9db/data/memory/.control/update-receipt.json')); print({k:r.get(k) for k in ('state','phase','note','summary')})"
          fi
          docker ps -a --format '{{.Names}} {{.Status}}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-profiles-${{ matrix.scenario }}
          path: evidence/
          if-no-files-found: ignore
